# ambi-tv configuration file
#
# Please have a look at the included file README.md for information on
# how this file works.
#

@main {
   button_gpio     3
   program         0
   on              0
   http_backend    1
   http_port       40100
}

v4l2-grab-source {
   name                          v4l2-video
   video-device                  /dev/video0
   video-width                   640
   video-height                  480
   video-fps                     30
   buffers                       4
   crop-left                     2
   crop-top                      2
   crop-right                    2
   crop-bottom                   2
   autocrop-luminance-threshold  17
}

yuv-enhance-coloreffect {
   name                          yuv-enhance
   y-scan-stride                 8
   y-histogram-inset             0.0005
   y-min-dynamic-range           35
   y-flat-scale                  0.85
   uv-boost                      0.35
}

timer-source {
   name     timer-30fps
   millis   33
}

lpd8806-spidev-sink {
   name              led-frame
   spi-device        /dev/spidev0.0
   spi-speed-hz      2500000
   leds-top          34-63             # left-to-right
   leds-bottom       13-0,4X,97-84     # left-to-right
   leds-left         33-14             # top-to-bottom
   leds-right        64-83             # top-to-bottom
   led-inset-top     -0.75
   led-inset-bottom  -3.0
   led-inset-left    -9.0
   led-inset-right   -9.0
   blended-frames    8 
   gamma-red         1.75
   gamma-green       1.75
   gamma-blue        1.75
}

avg-color-processor {
   name              avg-color
}

edge-color-processor {
   name              edge-color
   box-width         16
   box-height        16
}

mood-light-processor {
   name              mood-light
   speed             2
}

color-lamp-processor {
   name              rgb-lamp
   transition_speed  200
   hue               21
   saturation        171
   value             140
}

&program_tv_edge_color {
   activate          &v4l2-video
   activate          &yuv-enhance
   activate          &edge-color
   activate          &led-frame
}

&program_tv_avg_color {
   activate          &v4l2-video
   activate          &yuv-enhance
   activate          &avg-color
   activate          &led-frame
}

&program_mood_light {
   activate          &timer-30fps
   activate          &mood-light
   activate          &led-frame
}

&program_rgb_lamp {
   activate          &timer-30fps
   activate          &rgb-lamp
   activate          &led-frame
}
